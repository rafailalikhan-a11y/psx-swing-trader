name: Refresh PSX Market Data

on:
  workflow_dispatch:
  schedule:
    # Every 15 min, 04:15-10:45 UTC (= 09:15-15:45 PKT), Mon-Fri.
    # The scraper itself checks exact PSX hours and skips out-of-hours runs
    # without writing files, so stale data is never published.
    - cron: '*/15 4-10 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSX data collector
        run: python3 scraper.py

      - name: Commit updated market data
        run: |
          git config user.name "psx-data-bot"
          git config user.email "actions@github.com"
          git add data/quotes.json data/signals.json
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update PSX market data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi


